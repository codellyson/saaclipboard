name: Release

# Push a version tag to publish: git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString $VERSION" Support/Info.plist
          /usr/libexec/PlistBuddy -c "Set CFBundleVersion $GITHUB_RUN_NUMBER" Support/Info.plist

      - name: Package
        run: ./scripts/package.sh

      # Ad-hoc signed until a Developer ID cert is added, so it ships as a prerelease.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "Saaclipboard ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --prerelease
